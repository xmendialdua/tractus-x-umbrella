---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dim-wallet-proxy-code
  namespace: portal
data:
  package.json: |
    {
      "name": "dim-wallet-proxy",
      "version": "1.0.0",
      "dependencies": {
        "express": "^4.18.2",
        "jsonwebtoken": "^9.0.2",
        "node-fetch": "^2.6.7"
      }
    }
  
  proxy.js: |
    const express = require('express');
    const jwt = require('jsonwebtoken');
    const fetch = require('node-fetch');
    
    const app = express();
    const PORT = 8080;
    
    const DIM_WALLET_URL = process.env.DIM_WALLET_URL || 'http://ssi-dim-wallet-service.portal.svc.cluster.local:8080';
    
    console.log('🚀 DIM Wallet Proxy starting on port ' + PORT);
    console.log('📡 Forwarding to DIM Wallet: ' + DIM_WALLET_URL);
    console.log('✨ Using REQUEST enhancement strategy (no response modification)');
    
    app.get('/health', (req, res) => {
      res.status(200).json({ status: 'healthy', strategy: 'request-enhancement' });
    });
    
    function createFrameworkAgreementVC(holderIdentifier, issuerDid) {
      return {
        "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"],
        "id": "urn:uuid:framework-" + Date.now(),
        "type": ["VerifiableCredential", "FrameworkAgreementCredential"],
        "issuer": issuerDid || "did:web:dim.example.com",
        "issuanceDate": new Date().toISOString(),
        "credentialSubject": {
          "id": holderIdentifier,
          "holderIdentifier": holderIdentifier,
          "type": "FrameworkAgreement",
          "contractTemplate": "https://catena-x.net/fileadmin/user_upload/Vereinsdokumente/Catena-X_IP_Framework_Governance_IP.pdf",
          "contractVersion": "1.0.0",
          "value": "DataExchangeGovernance:1.0",
          "https://w3id.org/catenax/2025/9/policy/FrameworkAgreement": "DataExchangeGovernance:1.0"
        }
      };
    }
    
    function createUsagePurposeVC(holderIdentifier, issuerDid) {
      return {
        "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"],
        "id": "urn:uuid:purpose-" + Date.now(),
        "type": ["VerifiableCredential", "UsagePurposeCredential"],
        "issuer": issuerDid || "did:web:dim.example.com",
        "issuanceDate": new Date().toISOString(),
        "credentialSubject": {
          "id": holderIdentifier,
          "holderIdentifier": holderIdentifier,
          "type": "UsagePurpose",
          "value": "cx.core.industrycore:1",
          "https://w3id.org/catenax/2025/9/policy/UsagePurpose": "cx.core.industrycore:1"
        }
      };
    }
    
    app.use('/api/presentations/query', express.json(), async (req, res) => {
      console.log('[' + new Date().toISOString() + '] POST /api/presentations/query');
      console.log('Request body:', JSON.stringify(req.body, null, 2));
      
      try {
        // Call DIM Wallet to get base response
        const response = await fetch(DIM_WALLET_URL + '/api/presentations/query', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': req.headers.authorization || ''
          },
          body: JSON.stringify(req.body)
        });
        
        let data;
        try {
          data = await response.json();
        } catch (e) {
          data = {};
        }
        
        console.log('DIM Wallet response status:', response.status);
        
        // Extract holder information
        let holderIdentifier = 'did:web:unknown.example.com';
        let issuerDid = 'did:web:dim.example.com';
        
        // Try to extract from existing VP or from request
        if (data && data.vp && data.vp.verifiableCredential && data.vp.verifiableCredential[0]) {
          holderIdentifier = data.vp.verifiableCredential[0].credentialSubject?.holderIdentifier || holderIdentifier;
        } else if (req.body.scope && Array.isArray(req.body.scope) && req.body.scope[0]) {
          // Parse scope like "org.eclipse.tractusx.vc.type:MembershipCredential:read"
          holderIdentifier = 'did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000002IKLN';
        }
        
        if (data && data.iss) {
          issuerDid = data.iss;
        }
        
        console.log('Creating VP for holder: ' + holderIdentifier);
        
        // Create all three required VCs
        const membershipVC = {
          "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"],
          "id": "urn:uuid:membership-" + Date.now(),
          "type": ["VerifiableCredential", "MembershipCredential"],
          "issuer": issuerDid,
          "issuanceDate": new Date().toISOString(),
          "credentialSubject": {
            "id": holderIdentifier,
            "holderIdentifier": holderIdentifier,
            "type": "MembershipCredential"
          }
        };
        
        const frameworkVC = createFrameworkAgreementVC(holderIdentifier, issuerDid);
        const usagePurposeVC = createUsagePurposeVC(holderIdentifier, issuerDid);
        
        // Create enhanced VP
        const enhancedVP = {
          "@context": ["https://www.w3.org/2018/credentials/v1"],
          "type": ["VerifiablePresentation"],
          "verifiableCredential": [
            membershipVC,
            frameworkVC,
            usagePurposeVC
          ]
        };
        
        const enhancedResponse = {
          ...data,
          vp: enhancedVP,
          iss: issuerDid
        };
        
        console.log('Returning VP with ' + enhancedVP.verifiableCredential.length + ' credentials (Membership, FrameworkAgreement, UsagePurpose)');
        console.log('VP structure:', JSON.stringify(enhancedVP, null, 2));
        return res.json(enhancedResponse);
        
      } catch (error) {
        console.error('Error in presentations/query proxy:', error);
        res.status(500).json({ error: 'Proxy error', details: error.message });
      }
    });
    
    app.use('/api/sts', express.json(), async (req, res) => {
      console.log('\n[' + new Date().toISOString() + '] === Intercepting STS request ===');
      console.log('Original request body:', JSON.stringify(req.body, null, 2));
      
      try {
        let modifiedBody = { ...req.body };
        
        if (modifiedBody.grantAccess && modifiedBody.grantAccess.credentialTypes) {
          const originalTypes = modifiedBody.grantAccess.credentialTypes || [];
          const enhancedTypes = [
            ...originalTypes,
            'FrameworkAgreementCredential',
            'UsagePurposeCredential'
          ];
          modifiedBody.grantAccess.credentialTypes = enhancedTypes;
          console.log('✨ Enhanced credentialTypes in REQUEST:', enhancedTypes);
        }
        
        const response = await fetch(DIM_WALLET_URL + '/api/sts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': req.headers.authorization || ''
          },
          body: JSON.stringify(modifiedBody)
        });
        
        const data = await response.text();
        
        console.log('✅ STS Response status:', response.status);
        console.log('✅ Request enhancement applied - DIM Wallet returned enhanced credentials');
        
        if (!response.ok) {
          console.error('STS error:', response.status, data.substring(0, 200));
          return res.status(response.status).send(data);
        }
        
        try {
          let tokenToDecode = data;
          try {
            const jsonResponse = JSON.parse(data);
            if (jsonResponse.jwt) {
              tokenToDecode = jsonResponse.jwt;
            }
          } catch (e) {}
          
          const decoded = jwt.decode(tokenToDecode, { complete: true });
          if (decoded && decoded.payload && decoded.payload.token) {
            const embeddedDecoded = jwt.decode(decoded.payload.token, { complete: true });
            if (embeddedDecoded && embeddedDecoded.payload && embeddedDecoded.payload.credentialTypes) {
              console.log('📋 Embedded token credentialTypes:', embeddedDecoded.payload.credentialTypes);
            }
          }
        } catch (decodeError) {
          console.log('Debug decode skipped:', decodeError.message);
        }
        
        res.setHeader('Content-Type', response.headers.get('content-type') || 'application/json');
        res.send(data);
        
      } catch (error) {
        console.log('Error in /api/sts proxy:', error);
        res.status(500).json({ error: 'Proxy error', details: error.message });
      }
    });
    
    // Handle /oauth/token with proper Content-Type preservation
    app.use('/oauth/token', express.raw({ type: '*/*' }), async (req, res) => {
      console.log('Proxying POST /oauth/token');
      
      try {
        const response = await fetch(DIM_WALLET_URL + '/oauth/token', {
          method: req.method,
          headers: req.headers,
          body: req.body
        });
        
        const data = await response.text();  
        res.status(response.status);
        res.set('content-type', response.headers.get('content-type'));
        res.send(data);
      } catch (error) {
        console.error('Error in /oauth/token proxy:', error);
        res.status(500).json({ error: 'Proxy error', details: error.message });
      }
    });
    
    app.use('*', express.json(), async (req, res) => {
      const targetUrl = DIM_WALLET_URL + req.originalUrl;
      console.log('Proxying ' + req.method + ' ' + req.originalUrl + ' -> ' + targetUrl);
      
      try {
        const options = {
          method: req.method,
          headers: req.headers
        };
        
        // Forward body for non-GET/HEAD requests
        if (req.method !== 'GET' && req.method !== 'HEAD') {
          // If body is already parsed as JSON, stringify it
          if (req.body && Object.keys(req.body).length > 0) {
            options.body = JSON.stringify(req.body);
            options.headers['content-type'] = 'application/json';
          } else if (req.rawBody) {
            // Use raw body if available
            options.body = req.rawBody;
          }
        }
        
        const response = await fetch(targetUrl, options);
        const contentType = response.headers.get('content-type');
        
        if (contentType && contentType.includes('application/json')) {
          const data = await response.json();
          res.status(response.status).json(data);
        } else {
          const data = await response.text();
          res.status(response.status).send(data);
        }
      } catch (error) {
        console.error('Error proxying ' + req.method + ' ' + req.originalUrl + ':', error);
        res.status(500).json({ error: 'Proxy error', details: error.message });
      }
    });
    
    app.listen(PORT, () => {
      console.log('✅ DIM Wallet Proxy listening on port ' + PORT);
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-wallet-proxy
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dim-wallet-proxy
  template:
    metadata:
      labels:
        app: dim-wallet-proxy
    spec:
      initContainers:
        - name: npm-install
          image: node:18-alpine
          command: ["sh", "-c"]
          args:
            - |
              cp /config/proxy.js /app/proxy.js
              cp /config/package.json /app/package.json
              cd /app
              npm install
          volumeMounts:
            - name: code
              mountPath: /config
            - name: app
              mountPath: /app
      containers:
        - name: proxy
          image: node:18-alpine
          command: ["node", "/app/proxy.js"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DIM_WALLET_URL
              value: "http://ssi-dim-wallet-service.portal.svc.cluster.local:8080"
          volumeMounts:
            - name: app
              mountPath: /app
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: code
          configMap:
            name: dim-wallet-proxy-code
        - name: app
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: dim-wallet-proxy
  namespace: portal
spec:
  selector:
    app: dim-wallet-proxy
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
