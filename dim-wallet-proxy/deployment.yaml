---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-wallet-proxy
  namespace: portal
  labels:
    app: dim-wallet-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dim-wallet-proxy
  template:
    metadata:
      labels:
        app: dim-wallet-proxy
    spec:
      containers:
      - name: proxy
        image: dim-wallet-proxy:latest
        imagePullPolicy: IfNotPresent  # Usar imagen si ya está en el nodo
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: DIM_WALLET_URL
          value: "http://ssi-dim-wallet-service.portal.svc.cluster.local:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /oauth/token
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /oauth/token
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dim-wallet-proxy
  namespace: portal
  labels:
    app: dim-wallet-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: dim-wallet-proxy
