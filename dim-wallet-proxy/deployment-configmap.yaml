---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dim-wallet-proxy-code
  namespace: portal
data:
  package.json: |
    {
      "name": "dim-wallet-proxy",
      "version": "1.0.0",
      "dependencies": {
        "express": "^4.18.2",
        "http-proxy-middleware": "^2.0.6",
        "jsonwebtoken": "^9.0.2",
        "node-fetch": "^3.3.2"
      }
    }
  
  proxy.js: |
    const express = require('express');
    const { createProxyMiddleware } = require('http-proxy-middleware');
    const jwt = require('jsonwebtoken');

    const app = express();
    const PORT = process.env.PORT || 8080;
    const DIM_WALLET_URL = process.env.DIM_WALLET_URL || 'http://ssi-dim-wallet-service.portal.svc.cluster.local:8080';

    app.use((req, res, next) => {
      console.log(`[${new Date().toISOString()}] ${req.method} ${req.path}`);
      next();
    });

    app.use('/api/presentations/query', express.json(), async (req, res) => {
      console.log('Intercepting presentation query');
      
      try {
        const fetch = (await import('node-fetch')).default;
        const response = await fetch(`${DIM_WALLET_URL}/api/presentations/query`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': req.headers.authorization || ''
          },
          body: JSON.stringify(req.body)
        });

        let data = await response.text();
        
        console.log('Received DIM Wallet response, length:', data.length);
        
        if (!response.ok) {
          return res.status(response.status).send(data);
        }

        try {
          const decoded = jwt.decode(data, { complete: true });
          
          console.log('Decoded token exists:', !!decoded);
          console.log('Has payload:', !!decoded?.payload);
          console.log('Has vp:', !!decoded?.payload?.vp);
          
          if (decoded?.payload?.vp) {
            console.log('Adding VCs for BPN:', decoded.payload.bpn);
            
            const bpn = decoded.payload.bpn;
            const issuerDid = decoded.payload.iss;
            const now = Math.floor(Date.now() / 1000);
            const exp = now + 31536000;
            
            const frameworkVC = jwt.sign({
              aud: [issuerDid], bpn, sub: issuerDid, iss: issuerDid, exp, iat: now,
              vc: {
                credentialSubject: { holderIdentifier: bpn, id: issuerDid, contractTemplate: "https://public.catena-x.org/contracts/", contractVersion: "1.0.0", "https://w3id.org/catenax/2025/9/policy/FrameworkAgreement": "DataExchangeGovernance:1.0" },
                id: `${issuerDid}#fw-${Date.now()}`,
                type: ["VerifiableCredential", "FrameworkAgreementCredential"],
                "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"],
                issuer: issuerDid,
                issuanceDate: new Date().toISOString(),
                expirationDate: new Date(exp * 1000).toISOString()
              },
              jti: `fw-${Date.now()}`
            }, 'dev-secret', { algorithm: 'HS256' });
            
            const usageVC = jwt.sign({
              aud: [issuerDid], bpn, sub: issuerDid, iss: issuerDid, exp, iat: now,
              vc: {
                credentialSubject: { holderIdentifier: bpn, id: issuerDid, usagePurpose: "cx.core.industrycore:1", "https://w3id.org/catenax/2025/9/policy/UsagePurpose": "cx.core.industrycore:1" },
                id: `${issuerDid}#up-${Date.now()}`,
                type: ["VerifiableCredential", "UsagePurposeCredential"],
                "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"],
                issuer: issuerDid,
                issuanceDate: new Date().toISOString(),
                expirationDate: new Date(exp * 1000).toISOString()
              },
              jti: `up-${Date.now()}`
            }, 'dev-secret', { algorithm: 'HS256' });
            
            const vcs = decoded.payload.vp.verifiableCredential || [];
            const enhanced = jwt.sign({
              ...decoded.payload,
              vp: { ...decoded.payload.vp, verifiableCredential: [...vcs, frameworkVC, usageVC] }
            }, 'dev-secret', { algorithm: 'HS256', header: { kid: decoded.header.kid, typ: 'JWT' } });
            
            console.log('Enhanced VP with', vcs.length + 2, 'credentials');
            res.setHeader('Content-Type', 'text/plain');
            return res.send(enhanced);
          }
        } catch (e) {
          console.error('Decode error:', e.message);
        }
        
        res.setHeader('Content-Type', 'text/plain');
        res.send(data);
      } catch (error) {
        console.error('Proxy error:', error);
        res.status(500).json({ error: error.message });
      }
    });

    app.use('/api/sts', express.json(), async (req, res) => {
      console.log('=== Intercepting STS request ===');
      console.log('Original request body:', JSON.stringify(req.body, null, 2));
      
      // ENHANCE REQUEST: Add missing credential types before sending to DIM Wallet
      let modifiedBody = { ...req.body };
      
      if (modifiedBody.grantAccess && modifiedBody.grantAccess.credentialTypes) {
        const originalTypes = modifiedBody.grantAccess.credentialTypes || [];
        const enhancedTypes = [...originalTypes, 'FrameworkAgreementCredential', 'UsagePurposeCredential'];
        modifiedBody.grantAccess.credentialTypes = enhancedTypes;
        console.log('✨ Enhanced credentialTypes in REQUEST:', enhancedTypes);
      }
      
      try {
        const fetch = (await import('node-fetch')).default;
        const response = await fetch(`${DIM_WALLET_URL}/api/sts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': req.headers.authorization || '' },
          body: JSON.stringify(modifiedBody)
        });

        let data = await response.text();
        
        console.log('STS Response status:', response.status);
        console.log('STS Response length:', data.length);
        
        if (!response.ok) {
          console.error('STS error:', response.status, data.substring(0, 200));
          return res.status(response.status).send(data);
        }

        try {
          console.log('Attempting to decode STS response as JWT...');
          console.log('First 100 chars:', data.substring(0, 100));
          
          // The response might be JSON with a jwt field
          let tokenToDecode = data;
          try {
            const jsonResponse = JSON.parse(data);
            if (jsonResponse.jwt) {
              console.log('STS response is JSON with jwt field');
              tokenToDecode = jsonResponse.jwt;
            }
          } catch (e) {
            // Not JSON, assume it's already a JWT string
            console.log('STS response is direct JWT string');
          }
          
          const decoded = jwt.decode(tokenToDecode, { complete: true });
          console.log('Decoded result:', decoded ? 'SUCCESS' : 'NULL');
          if (decoded) {
            console.log('=== STS JWT DECODED ===');
            console.log('Header:', JSON.stringify(decoded.header, null, 2));
            console.log('Payload keys:', Object.keys(decoded.payload || {}));
            console.log('Full payload:', JSON.stringify(decoded.payload, null, 2));
            
            // Check if credentialTypes needs enhancement (token or access_token field)
            
            if (decoded.payload?.token) {
              console.log('\n=== ENHANCING TOKEN field ===');
              const embeddedDecoded = jwt.decode(decoded.payload.token, { complete: true });
              if (embeddedDecoded && embeddedDecoded.payload?.credentialTypes) {
                const existingTypes = embeddedDecoded.payload.credentialTypes || [];
                console.log('Original credentialTypes:', existingTypes);
                
                const newCredentialTypes = [...existingTypes, 'FrameworkAgreementCredential', 'UsagePurposeCredential'];
                console.log('Enhanced credentialTypes:', newCredentialTypes);
                
                const enhancedEmbeddedPayload = { ...embeddedDecoded.payload, credentialTypes: newCredentialTypes };
                const enhancedEmbeddedToken = jwt.sign(enhancedEmbeddedPayload, 'dev-secret', { algorithm: 'HS256' });
                
                const enhancedSIPayload = { ...decoded.payload, token: enhancedEmbeddedToken };
                const enhancedSIToken = jwt.sign(enhancedSIPayload, 'dev-secret', { algorithm: 'HS256' });                
                console.log('Returning enhanced SI Token with updated token field');
                res.setHeader('Content-Type', 'application/json');
                return res.json({ jwt: enhancedSIToken });
              }
            }
            
            if (decoded.payload?.access_token) {
              console.log('\n=== ENHANCING ACCESS_TOKEN field ===');
              const embeddedDecoded = jwt.decode(decoded.payload.access_token, { complete: true });
              if (embeddedDecoded && embeddedDecoded.payload?.credentialTypes) {
                const existingTypes = embeddedDecoded.payload.credentialTypes || [];
                console.log('Original credentialTypes:', existingTypes);
                
                const newCredentialTypes = [...existingTypes, 'FrameworkAgreementCredential', 'UsagePurposeCredential'];
                console.log('Enhanced credentialTypes:', newCredentialTypes);
                
                const enhancedEmbeddedPayload = { ...embeddedDecoded.payload, credentialTypes: newCredentialTypes };
                const enhancedEmbeddedToken = jwt.sign(enhancedEmbeddedPayload, 'dev-secret', { algorithm: 'HS256' });
                
                const enhancedSIPayload = { ...decoded.payload, access_token: enhancedEmbeddedToken };
                const enhancedSIToken = jwt.sign(enhancedSIPayload, 'dev-secret', { algorithm: 'HS256' });
                
                console.log('Returning enhanced SI Token with updated access_token field');
                res.setHeader('Content-Type', 'application/json');
                return res.json({ jwt: enhancedSIToken });
              }
            }
            
            // Legacy VP-based enhancement
            if (decoded.payload?.vp) {
              console.log('STS JWT contains VP with credentials:', decoded.payload.vp.verifiableCredential?.length || 0);
              
              const vcs = decoded.payload.vp.verifiableCredential || [];
              const bpn = decoded.payload.bpn;
              const issuerDid = decoded.payload.iss;
              const now = Math.floor(Date.now() / 1000);
              const exp = now + 31536000;
              
              console.log(`Enhancing STS VP for BPN: ${bpn}`);
              
              const frameworkVC = jwt.sign({
                aud: [issuerDid], bpn, sub: issuerDid, iss: issuerDid, exp, iat: now,
                vc: { credentialSubject: { holderIdentifier: bpn, id: issuerDid, contractTemplate: "https://public.catena-x.org/contracts/", contractVersion: "1.0.0", "https://w3id.org/catenax/2025/9/policy/FrameworkAgreement": "DataExchangeGovernance:1.0" }, id: `${issuerDid}#fw-${Date.now()}`, type: ["VerifiableCredential", "FrameworkAgreementCredential"], "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"], issuer: issuerDid, issuanceDate: new Date().toISOString(), expirationDate: new Date(exp * 1000).toISOString() }, jti: `fw-${Date.now()}`
              }, 'dev-secret', { algorithm: 'HS256' });
              
              const usageVC = jwt.sign({
                aud: [issuerDid], bpn, sub: issuerDid, iss: issuerDid, exp, iat: now,
                vc: { credentialSubject: { holderIdentifier: bpn, id: issuerDid, usagePurpose: "cx.core.industrycore:1", "https://w3id.org/catenax/2025/9/policy/UsagePurpose": "cx.core.industrycore:1" }, id: `${issuerDid}#up-${Date.now()}`, type: ["VerifiableCredential", "UsagePurposeCredential"], "@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/catenax/credentials/v1.0.0"], issuer: issuerDid, issuanceDate: new Date().toISOString(), expirationDate: new Date(exp * 1000).toISOString() }, jti: `up-${Date.now()}`
              }, 'dev-secret', { algorithm: 'HS256' });
              
              const enhanced = jwt.sign({
                ...decoded.payload,
                vp: { ...decoded.payload.vp, verifiableCredential: [...vcs, frameworkVC, usageVC] }
              }, 'dev-secret', { algorithm: 'HS256', header: { kid: decoded.header.kid, typ: 'JWT' } });
              
              console.log('Enhanced STS VP with', vcs.length + 2, 'credentials');
              res.setHeader('Content-Type', 'text/plain');
              return res.send(enhanced);
            } else {
              console.log('STS JWT - no credentialTypes field found to enhance, forwarding as-is');
            }
          }
        } catch (decodeError) {
          console.log('STS response is not a JWT:', decodeError.message);
        }
        
        res.setHeader('Content-Type', response.headers.get('content-type') || 'text/plain');
        res.send(data);
        
      } catch (error) {
        console.error('STS Proxy error:', error);
        res.status(500).json({ error: 'STS Proxy error', message: error.message });
      }
    });

    app.use('/', createProxyMiddleware({
      target: DIM_WALLET_URL,
      changeOrigin: true,
      logLevel: 'info'
    }));

    app.listen(PORT, () => {
      console.log(`Proxy on port ${PORT}, forwarding to ${DIM_WALLET_URL}`);
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-wallet-proxy
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dim-wallet-proxy
  template:
    metadata:
      labels:
        app: dim-wallet-proxy
    spec:
      initContainers:
      - name: install-deps
        image: node:18-alpine
        command: ['sh', '-c', 'cp /code-src/* /app/ && cd /app && npm install --only=production']
        volumeMounts:
        - name: code-src
          mountPath: /code-src
        - name: app-dir
          mountPath: /app
      containers:
      - name: proxy
        image: node:18-alpine
        command: ['node', '/app/proxy.js']
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DIM_WALLET_URL
          value: "http://ssi-dim-wallet-service.portal.svc.cluster.local:8080"
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: app-dir
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: code-src
        configMap:
          name: dim-wallet-proxy-code
      - name: app-dir
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: dim-wallet-proxy
  namespace: portal
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: dim-wallet-proxy
