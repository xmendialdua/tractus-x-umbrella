        client:
          id: BPNL00000002IKLN
          secret_alias: edc-wallet-secret
  controlplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.51.178.94.25.nip.io/api
      EDC_IAM_DID_WEB_USE_HTTPS: false
      # BDRS configuration with new property names (EDC v0.11.1+)
      TX_EDC_IAM_IATP_BDRS_SERVER_URL: http://bdrs-server.portal.svc.cluster.local:8082/api/directory
      TX_EDC_IAM_IATP_BDRS_CACHE_VALIDITY: "600"
    bdrs:
      server:
        url: http://bdrs-server.portal:8082/api/directory
    endpoints:
      management:
        authKey: ikln-api-key-change-in-production
    ingresses:
      - enabled: true
        hostname: "edc-ikln-control.51.178.94.25.nip.io"
        endpoints:
          - default
          - protocol
          - management
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-ikln-control-tls"
  dataplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.51.178.94.25.nip.io/api
      EDC_IAM_DID_WEB_USE_HTTPS: false
    ingresses:
      - enabled: true
        hostname: "edc-ikln-data.51.178.94.25.nip.io"
        endpoints:
          - default
          - public
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-ikln-data-tls"
    token:
      signer:
        privatekey_alias: tokenSignerPrivateKey
      verifier:
        publickey_alias: tokenSignerPublicKey
  postgresql:
    nameOverride: postgresql
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/edc"
    auth:
      password: "dbpassworddataconsumerone"
      postgresPassword: "dbpassworddataconsumerone"
  vault:
    hashicorp:
      url: http://{{ .Release.Name }}-vault:8200
      token: "root"
      paths:
        secret: "/v1/secret"
        folder: ""  
    secretNames:
      transferProxyTokenSignerPrivateKey: tokenSignerPrivateKey
      transferProxyTokenSignerPublicKey: tokenSignerPublicKey
      transferProxyTokenEncryptionAesKey: tokenEncryptionAesKey

vault:
  enabled: true
  server:
    standalone:
      enabled: true
    dev:
      enabled: true
      devRootToken: "root"
  nameOverride: vault
  fullnameOverride: ""

postgresql:
  enabled: true
  auth:
    database: "edc"
    username: "user"
    password: "dbpassworddataconsumerone"
    postgresPassword: "dbpassworddataconsumerone"
 
