---

tractusx-connector:
  nameOverride: ikln-edc
  participant:
    id: BPNL00000002IKLN
  iatp:
    id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000002IKLN
    trustedIssuers:
      - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
    sts:
      dim:
        url: https://ssi-dim-wallet-stub.51.178.94.25.nip.io/api/sts
      oauth:
        token_url: https://ssi-dim-wallet-stub.51.178.94.25.nip.io/oauth/token
        client:
          id: BPNL00000002IKLN
          secret_alias: edc-wallet-secret
  controlplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: https://ssi-dim-wallet-stub.51.178.94.25.nip.io/api
      EDC_IAM_DID_WEB_USE_HTTPS: false
    bdrs:
      server:
        url: https://ssi-dim-wallet-stub.51.178.94.25.nip.io/api/v1/directory
    endpoints:
      management:
        authKey: ikln-api-key-change-in-production
    ingresses:
      - enabled: true
        hostname: "edc-ikln-control.51.178.94.25.nip.io"
        endpoints:
          - default
          - protocol
          - management
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-ikln-control-tls"
  dataplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: https://ssi-dim-wallet-stub.51.178.94.25.nip.io/api
      EDC_IAM_DID_WEB_USE_HTTPS: false
    ingresses:
      - enabled: true
        hostname: "edc-ikln-data.51.178.94.25.nip.io"
        endpoints:
          - default
          - public
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-ikln-data-tls"
    token:
      signer:
        privatekey_alias: tokenSignerPrivateKey
      verifier:
        publickey_alias: tokenSignerPublicKey
  postgresql:
    nameOverride: postgresql
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/edc"
    auth:
      password: "dbpassworddataconsumerone"
      postgresPassword: "dbpassworddataconsumerone"
  vault:
    hashicorp:
      url: http://{{ .Release.Name }}-vault:8200
    secretNames:
      transferProxyTokenSignerPrivateKey: tokenSignerPrivateKey
      transferProxyTokenSignerPublicKey: tokenSignerPublicKey
      transferProxyTokenEncryptionAesKey: tokenEncryptionAesKey

vault:
  nameOverride: vault
  fullnameOverride: ""
  enabled: true
  server:
    postStart: []

postgresql:
  enabled: true
  auth:
    database: "edc"
    username: "user"
    password: "dbpassworddataconsumerone"
    postgresPassword: "dbpassworddataconsumerone"
 
