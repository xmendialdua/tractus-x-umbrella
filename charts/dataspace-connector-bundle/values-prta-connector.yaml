  iatp:
    id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CSTM
    trustedIssuers:
      - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
    sts:
      dim:
        url: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api/sts
      oauth:
        token_url: http://dim-wallet-proxy.portal.svc.cluster.local:8080/oauth/token
        client:
          id: BPNL00000003CSTM
          secret_alias: edc-wallet-secret
  controlplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api
      EDC_IAM_DID_WEB_USE_HTTPS: false
      # BDRS configuration with new property names (EDC v0.11.1+)
      TX_EDC_IAM_IATP_BDRS_SERVER_URL: http://bdrs-server.portal.svc.cluster.local:8082/api/directory
      TX_EDC_IAM_IATP_BDRS_CACHE_VALIDITY: "600"
      EDC_IAM_STS_OAUTH_TOKEN_SIGNING_ALGORITHM: "ES256K"
    bdrs:
      server:
        url: http://bdrs-server.portal:8082/api/directory
    endpoints:
      management:
        authKey: cstm-api-key-change-in-production
    # Recursos reducidos para evitar problemas de CPU en el cluster
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    ingresses:
      - enabled: true
        hostname: "edc-cstm-control.51.178.94.25.nip.io"
        endpoints:
          - default
          - protocol
          - management
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-cstm-control-tls"
  dataplane:
    env:
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api
      EDC_IAM_DID_WEB_USE_HTTPS: true
      EDC_DATAPLANE_TOKEN_SIGNING_ALGORITHM: "ES256K"
      EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "tokenSignerPrivateKey"
      EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "tokenSignerPublicKey"
    # Recursos reducidos para evitar problemas de CPU en el cluster
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    ingresses:
      - enabled: true
        hostname: "edc-cstm-data.51.178.94.25.nip.io"
        endpoints:
          - default
          - public
        className: "nginx"
        tls:
          enabled: true
          secretName: "edc-cstm-data-tls"
    token:
      signer:
        privatekey_alias: tokenSignerPrivateKey
      verifier:
        publickey_alias: tokenSignerPublicKey
  postgresql:
    nameOverride: postgresql
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/edc"
    auth:
      password: "dbpassworddataconsumerone"
      postgresPassword: "dbpassworddataconsumerone"
  vault:
    hashicorp:
      url: http://{{ .Release.Name }}-vault:8200
      token: "root"
      paths:
        secret: "/v1/secret"
        folder: ""  
    secretNames:
      transferProxyTokenSignerPrivateKey: tokenSignerPrivateKey
      transferProxyTokenSignerPublicKey: tokenSignerPublicKey
      transferProxyTokenEncryptionAesKey: tokenEncryptionAesKey

vault:
  enabled: true
  server:
    standalone:
      enabled: true
    dev:
      enabled: true
      devRootToken: "root"
  nameOverride: vault
  fullnameOverride: ""

postgresql:
  enabled: true
  auth:
    database: "edc"
    username: "user"
    password: "dbpassworddataconsumerone"
    postgresPassword: "dbpassworddataconsumerone"
  # Recursos reducidos para evitar problemas de CPU en el cluster
  primary:
    resources:
      limits:
        cpu: 150m
        memory: 192Mi
        ephemeral-storage: 1Gi
      requests:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 50Mi

