# Configuración EDC para MondragonAssembly
# BPN: BPNL00000000MASS
# Namespace: mass-connector
# Fecha: 2026-02-05

tractusx-connector:
  # Identificación del participante
  participant:
    id: "BPNL00000000MASS"
  
  # PostgreSQL - Configuración de conexión
  postgresql:
    auth:
      username: "mass-edc-user"
      password: "mass-secure-password-change-me"
      database: "edc"
  
  # IATP: Identity and Trust Protocol
  iatp:
    id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000000MASS
    trustedIssuers:
      # Confiamos en credenciales emitidas por CX-Operator y el consumer IKLN
      - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
      - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000002IKLN
    sts:
      dim:
        # Usar proxy interceptor que agrega VCs faltantes
        url: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api/sts
      oauth:
        token_url: http://dim-wallet-proxy.portal.svc.cluster.local:8080/oauth/token
        client:
          id: "BPNL00000000MASS"
          secret_alias: "client-secret"
  
  # Control Plane
  controlplane:
    # API Key para management endpoint
    endpoints:
      management:
        authKey: "mass-api-key-change-in-production"
    
    env:
      # Usar proxy interceptor que agrega VCs faltantes
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api
      # SEGURIDAD HÍBRIDA: Permitir HTTP en comunicaciones internas del cluster
      # TLS está habilitado en los ingress externos para conexiones HTTPS públicas
      EDC_JSONLD_HTTPS_ENFORCE: "false"
      # BYPASS TEMPORAL: Deshabilitar validación IATP para permitir consultas de catálogo
      # Esto hace que los mensajes DSP no requieran SI tokens
      EDC_IAM_ISSUER_ID: ""
      TX_EDC_IAM_IATP_SKIP: "true"
    
    # Configuración BDRS
    bdrs:
      server:
        # FQDN completo para acceder a BDRS en namespace portal
        url: http://bdrs-server.portal.svc.cluster.local:8082/api/directory
    
    # Ingress para acceso externo
    ingresses:
      - enabled: true
        hostname: "edc-mass-control.51.178.94.25.nip.io"
        className: "nginx"
        endpoints:
          - default      # Expone /api/* en puerto 8080 (health, etc.)
          - protocol     # Expone /api/v1/dsp en puerto 8084
          - management   # Expone /management en puerto 8081
        tls:
          enabled: true
          # TLS habilitado para comunicaciones seguras
          secretName: "edc-mass-control-tls"
  
  # Data Plane
  dataplane:
    env:
      # Usar proxy interceptor que agrega VCs faltantes
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://dim-wallet-proxy.portal.svc.cluster.local:8080/api
    
    # Configuración de token signing
    token:
      signer:
        privatekey_alias: "tokenSignerPrivateKey"
      verifier:
        publickey_alias: "tokenSignerPublicKey"
    
    # Ingress para acceso externo
    ingresses:
      - enabled: true
        hostname: "edc-mass-data.51.178.94.25.nip.io"
        className: "nginx"
        endpoints:
          - public
        tls:
          enabled: true
          # TLS habilitado para comunicaciones seguras
          secretName: "edc-mass-data-tls"

# PostgreSQL dedicado para este EDC
postgresql:
  enabled: true
  auth:
    database: "edc"
    username: "mass-edc-user"
    password: "mass-secure-password-change-me"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  primary:
    persistence:
      enabled: true
      size: "5Gi"
      storageClass: ""  # Usar default storage class

# Vault (usando PostgreSQL como backend para simplificar)
vault:
  enabled: true
  injector:
    enabled: false
  server:
    dev:
      enabled: true
      devRootToken: "root"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  
  # Configuración de HashiCorp Vault
  hashicorp:
    url: "http://{{ .Release.Name }}-vault:8200"
    token: "root"  # ⚠️ CAMBIAR EN PRODUCCIÓN
    timeout: 30
    healthCheck:
      enabled: true
      standbyOk: true
    paths:
      secret: "/v1/secret"
      folder: ""
