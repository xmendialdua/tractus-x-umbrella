# Configuración EDC para MondragonAssembly
# BPN: BPNL00000000MASS
# Namespace: mass-connector
# Fecha: 2026-02-05

tractusx-connector:
  # Identificación del participante
  participant:
    id: "BPNL00000000MASS"
  
  # PostgreSQL - Configuración de conexión
  postgresql:
    auth:
      username: "mass-edc-user"
      password: "mass-secure-password-change-me"
      database: "edc"
  
  # IATP: Identity and Trust Protocol
  iatp:
    id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000000MASS
    trustedIssuers:
      # Solo confiamos en credenciales emitidas por CX-Operator
      - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
    sts:
      dim:
        # IMPORTANTE: Usar FQDN porque el wallet está en namespace "portal"
        url: http://ssi-dim-wallet-service.portal.svc.cluster.local:8080/api/sts
      oauth:
        token_url: http://ssi-dim-wallet-service.portal.svc.cluster.local:8080/oauth/token
        client:
          id: "BPNL00000000MASS"
          secret_alias: "client-secret"
  
  # Control Plane
  controlplane:
    # API Key para management endpoint
    endpoints:
      management:
        authKey: "mass-api-key-change-in-production"
    
    env:
      # FQDN completo para acceder al wallet en namespace portal
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-service.portal.svc.cluster.local:8080/api
      # Aceptar certificados self-signed (solo desarrollo)
      EDC_JSONLD_HTTPS_ENFORCE: "false"
      # Deshabilitar verificación SSL completamente (SOLO DESARROLLO)
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustAll=true -Djdk.tls.client.protocols=TLSv1.2"
    
    # Configuración BDRS
    bdrs:
      server:
        # FQDN completo para acceder a BDRS en namespace portal
        url: http://bdrs-server.portal.svc.cluster.local:8082/api/directory
    
    # Ingress para acceso externo
    ingresses:
      - enabled: true
        hostname: "edc-mass-control.51.178.94.25.nip.io"
        className: "nginx"
        endpoints:
          - protocol
          - management
        tls:
          enabled: false
          # TLS deshabilitado para desarrollo - evita problemas con certificados self-signed
          secretName: ""
  
  # Data Plane
  dataplane:
    env:
      # FQDN completo para acceder al wallet en namespace portal
      TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-service.portal.svc.cluster.local:8080/api
    
    # Configuración de token signing
    token:
      signer:
        privatekey_alias: "tokenSignerPrivateKey"
      verifier:
        publickey_alias: "tokenSignerPublicKey"
    
    # Ingress para acceso externo
    ingresses:
      - enabled: true
        hostname: "edc-mass-data.51.178.94.25.nip.io"
        className: "nginx"
        endpoints:
          - public
        tls:
          enabled: false
          # TLS deshabilitado para desarrollo - evita problemas con certificados self-signed
          secretName: ""

# PostgreSQL dedicado para este EDC
postgresql:
  enabled: true
  auth:
    database: "edc"
    username: "mass-edc-user"
    password: "mass-secure-password-change-me"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  primary:
    persistence:
      enabled: true
      size: "5Gi"
      storageClass: ""  # Usar default storage class

# Vault (usando PostgreSQL como backend para simplificar)
vault:
  enabled: true
  injector:
    enabled: false
  server:
    dev:
      enabled: true
      devRootToken: "root"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  
  # Configuración de HashiCorp Vault
  hashicorp:
    url: "http://{{ .Release.Name }}-vault:8200"
    token: "root"  # ⚠️ CAMBIAR EN PRODUCCIÓN
    timeout: 30
    healthCheck:
      enabled: true
      standbyOk: true
    paths:
      secret: "/v1/secret"
      folder: ""
