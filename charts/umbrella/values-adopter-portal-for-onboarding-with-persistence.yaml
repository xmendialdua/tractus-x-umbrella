---

portal:
  enabled: true
  # -- uncomment the following for SMTP mail mock
  backend:
    mailing:
      host: "smtp4dev"
      port: "25"
      user: "portal-user"
      senderEmail: "portal-admin@tx.test"
      password: "portal-password"

  # -- uncomment the following for SMTP mail mock
  postgresql:
    primary:
      persistence:
        enabled: true
        size: 5Gi

centralidp:
  enabled: true
  # -- uncomment the following for SMTP mail mock
  keycloak:
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 3Gi

sharedidp:
  enabled: true
  # -- uncomment the following for SMTP mail mock
  keycloak:
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 2Gi

pgadmin4:
  enabled: true
  # -- uncomment the following for SMTP mail mock
  persistentVolume:
    enabled: true
    size: 1Gi

# Interfaces are disabled by default (other than IAM)

# Set 'enabled' to true if onboarding is required
bpdm:
  enabled: true
  # ✅ Persistencia habilitada para BPDM PostgreSQL compartido
  # Los 3 servicios (pool, gate, orchestrator) usan el mismo PostgreSQL
  bpdm-postgres:
    primary:
      persistence:
        enabled: true
        size: 3Gi

bdrs-server-memory:
  enabled: true  # ✅ Necesario para resolver BPN→DID en EDCs

selfdescription:
  enabled: true  # ✅ FASE 2: Habilitado para self-description

# Habilitar para ver emails de invitación
smtp4dev:
  enabled: true  # ✅ FASE 2: Habilitado para onboarding por UI

# Componentes para compartición de datos
bpndiscovery:
  enabled: true  # ✅ Necesario para descubrimiento de BPNs en EDCs
  enablePostgres: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    # ✅ Persistencia habilitada
    primary:
      persistence:
        enabled: true
        size: 2Gi

discoveryfinder:
  enabled: true  # ✅ Necesario para descubrimiento de EDCs en el dataspace
  enablePostgres: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    # ✅ Persistencia habilitada
    primary:
      persistence:
        enabled: true
        size: 2Gi

ssi-credential-issuer:
  enabled: true  # ✅ FASE 3: Habilitado para emisión de credenciales verificables
  # ✅ Persistencia habilitada
  postgresql:
    primary:
      persistence:
        enabled: true
        size: 3Gi

identity-and-trust-bundle:
  enabled: true  # ✅ FASE 4: Habilitado para DIM Wallet y gestión de identidades
  # ✅ Persistencia habilitada (si el bundle usa PostgreSQL)
  postgresql:
    primary:
      persistence:
        enabled: true
        size: 2Gi
