# Configuración para despliegue en OVH
# TestCompany1 (Provider): BPNL000000000065
# Ikerlan (Consumer): BPNL00000000015G
# CX-Operator: BPNL00000003CRHK

# Configuración adicional del wallet stub (se mergea con values-ovh-hosts-portal.yaml)
identity-and-trust-bundle:
  ssi-dim-wallet-stub:
    server:
      trustedIssuers:
        - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK

# EDC Consumer para Ikerlan
dataconsumerOne:
  enabled: true
  dataspace-connector-bundle:
    tractusx-connector:
      participant:
        id: "BPNL00000000015G"
      iatp:
        id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000000015G
        trustedIssuers:
          - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
        sts:
          dim:
            url: http://portal-ssi-dim-wallet-stub/api/sts
          oauth:
            token_url: http://portal-ssi-dim-wallet-stub/oauth/token
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://portal-ssi-dim-wallet-stub/api
        bdrs:
          server:
            url: http://bdrs-server:8080/api/v1/directory
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://portal-ssi-dim-wallet-stub/api

# EDC Provider para TestCompany1
tx-data-provider:
  enabled: true
  dataspace-connector-bundle:
    tractusx-connector:
      participant:
        id: "BPNL000000000065"
      iatp:
        id: did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL000000000065
        trustedIssuers:
          - did:web:ssi-dim-wallet-stub.51.178.94.25.nip.io:BPNL00000003CRHK
        sts:
          dim:
            url: http://portal-ssi-dim-wallet-stub/api/sts
          oauth:
            token_url: http://portal-ssi-dim-wallet-stub/oauth/token
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://portal-ssi-dim-wallet-stub/api
        bdrs:
          server:
            url: http://bdrs-server:8080/api/v1/directory
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://portal-ssi-dim-wallet-stub/api
